<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI stream manager workflow / Tekoäly lähetyksen apuohjaajana</title>
  <desc id="desc">An approved AI assistant reads selected VISP stream and OBS status. Any requested change goes to the creator for approval before it runs. / Hyväksytty AI-avustaja lukee valittuja VISPin lähetys- ja OBS-tilatietoja. Muutosehdotus siirtyy lähettäjälle hyväksyttäväksi ennen toteutusta.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1722"/><stop offset="1" stop-color="#152b39"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#25c4d8"/><stop offset="1" stop-color="#68e2be"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#54cbd1"/></marker>
    <style>
      .en{font:700 25px system-ui,sans-serif;fill:#eef5f7}.fi{font:400 17px system-ui,sans-serif;fill:#aec4cd}.small{font:500 16px system-ui,sans-serif;fill:#b8cbd1}.line{fill:none;stroke:#54cbd1;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="80" y="82" class="small">AI STREAM MANAGER / AI-LÄHETYKSEN APUOHJAAJA</text>
  <path d="M80 112h1440" stroke="#294452" stroke-width="2"/>

  <g transform="translate(90 265)">
    <rect width="280" height="280" rx="24" fill="#1b3342" stroke="#3b5b69" stroke-width="2"/>
    <rect x="105" y="30" width="70" height="125" rx="12" fill="#0b141c" stroke="#53cbd0" stroke-width="3"/>
    <circle cx="140" cy="140" r="4" fill="#93aab2"/>
    <text x="140" y="205" text-anchor="middle" class="en">Field stream</text>
    <text x="140" y="237" text-anchor="middle" class="fi">Kenttälähetys</text>
  </g>

  <path class="line" d="M390 405h120"/>

  <g transform="translate(530 265)">
    <rect width="320" height="280" rx="24" fill="#1b3342" stroke="#3b5b69" stroke-width="2"/>
    <circle cx="160" cy="90" r="42" fill="none" stroke="url(#accent)" stroke-width="5"/>
    <path d="m141 90 13 13 27-30" fill="none" stroke="#7ce0bc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="160" y="175" text-anchor="middle" class="en">VISP status</text>
    <text x="160" y="207" text-anchor="middle" class="fi">VISPin tila</text>
    <text x="160" y="245" text-anchor="middle" class="small">Read permission / Lukuoikeus</text>
  </g>

  <path class="line" d="M870 370h115"/>
  <path d="M870 460h110" fill="none" stroke="#c79754" stroke-width="4" stroke-dasharray="9 9" marker-end="url(#arrow)"/>

  <g transform="translate(1000 265)">
    <rect width="270" height="280" rx="24" fill="#1b3342" stroke="#3b5b69" stroke-width="2"/>
    <rect x="82" y="35" width="106" height="75" rx="14" fill="#0b141c" stroke="#59d2d0" stroke-width="3"/>
    <circle cx="116" cy="72" r="8" fill="#54d6b6"/><circle cx="154" cy="72" r="8" fill="#48bfd6"/>
    <text x="135" y="165" text-anchor="middle" class="en">AI assistant</text>
    <text x="135" y="198" text-anchor="middle" class="fi">AI-avustaja</text>
    <text x="135" y="237" text-anchor="middle" class="small">Report or proposal</text>
    <text x="135" y="261" text-anchor="middle" class="small">Raportti tai ehdotus</text>
  </g>

  <path class="line" d="M1290 405h105"/>

  <g transform="translate(1405 265)">
    <rect width="150" height="280" rx="24" fill="#26373c" stroke="#c79754" stroke-width="2"/>
    <circle cx="75" cy="78" r="30" fill="none" stroke="#e2b767" stroke-width="4"/>
    <path d="m61 78 10 10 19-23" fill="none" stroke="#e2b767" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="75" y="153" text-anchor="middle" class="en">Creator</text>
    <text x="75" y="184" text-anchor="middle" class="fi">Lähettäjä</text>
    <text x="75" y="230" text-anchor="middle" class="small">Approve</text>
    <text x="75" y="255" text-anchor="middle" class="small">Hyväksyy</text>
  </g>

  <g transform="translate(420 655)">
    <rect width="760" height="125" rx="22" fill="#12232e" stroke="#3b5b69" stroke-width="2"/>
    <circle cx="70" cy="62" r="18" fill="#54d6b6"/>
    <text x="112" y="56" class="en">Read status on request</text>
    <text x="112" y="88" class="fi">Lue tilat pyydettäessä</text>
    <path d="M390 25v75" stroke="#294452" stroke-width="2"/>
    <circle cx="438" cy="62" r="18" fill="#d9a75a"/>
    <text x="480" y="56" class="en">Review every change</text>
    <text x="480" y="88" class="fi">Tarkista jokainen muutos</text>
  </g>
</svg>
