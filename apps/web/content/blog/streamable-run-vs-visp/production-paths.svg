<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Streamable.run and VISP production paths</title><desc id="desc">The VISP path uses a direct relay while Streamable.run includes bonding and cloud OBS production.</desc>
  <rect width="1600" height="900" rx="48" fill="#081426"/><g font-family="system-ui" text-anchor="middle"><text x="800" y="100" fill="white" font-size="58" font-weight="700">Transport or a remote studio?</text><text x="170" y="300" fill="#67e8f9" font-size="34">VISP</text><text x="170" y="625" fill="#d8b4fe" font-size="34">Streamable.run</text>
  <g fill="white" font-size="30" font-weight="650"><rect x="310" y="230" width="300" height="130" rx="28" fill="#155e75"/><text x="460" y="310">Phone</text><rect x="760" y="230" width="300" height="130" rx="28" fill="#0e7490"/><text x="910" y="310">Direct relay</text><rect x="310" y="555" width="250" height="130" rx="28" fill="#581c87"/><text x="435" y="635">Encoder</text><rect x="675" y="555" width="250" height="130" rx="28" fill="#6b21a8"/><text x="800" y="635">Bonding</text><rect x="1040" y="555" width="250" height="130" rx="28" fill="#7e22ce"/><text x="1165" y="635">Cloud OBS</text></g></g><g stroke-linecap="round" stroke-width="16"><path d="M635 295h100" stroke="#67e8f9"/><path d="M585 620h65M950 620h65" stroke="#d8b4fe"/></g>
</svg>
