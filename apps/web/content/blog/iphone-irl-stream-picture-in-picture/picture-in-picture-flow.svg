<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Picture in Picture IRL streaming flow</title>
  <desc id="desc">An iPhone camera stays active in a floating window while another app is open, then the feed travels through a relay to OBS and the final live platform.</desc>
