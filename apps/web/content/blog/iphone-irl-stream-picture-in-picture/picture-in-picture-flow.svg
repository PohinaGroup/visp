    <circle cx="180" cy="260" r="18" fill="#48d7ff" stroke="#dff9ff" stroke-width="7"/>
    <rect x="158" y="70" width="132" height="190" rx="22" fill="#d9eef7" stroke="#48d7ff" stroke-width="8"/>
    <path d="M175 210l35-48 25 23 38-62" fill="none" stroke="#25516e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="245" cy="120" r="14" fill="#48d7ff"/>
  </g>
  <g transform="translate(660 265)">
    <rect width="280" height="370" rx="44" fill="#12243a" stroke="#48d7ff" stroke-width="8"/>
    <path d="M55 110h170M55 170h130M55 230h150" stroke="#7a93a8" stroke-width="18" stroke-linecap="round"/>
    <circle cx="220" cy="300" r="28" fill="#48d7ff"/>
  </g>
