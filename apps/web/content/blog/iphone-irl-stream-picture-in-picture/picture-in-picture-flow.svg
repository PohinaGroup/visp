    <rect x="24" y="28" width="182" height="224" rx="16" fill="#1f4763"/>
    <path d="M42 210l42-58 38 30 52-88" fill="none" stroke="#48d7ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
