      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111d30"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#48d7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="48" fill="url(#bg)"/>
  <path d="M430 450H660M940 450h220M1390 450h90" fill="none" stroke="#48d7ff" stroke-width="16" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g transform="translate(90 160)">
    <rect width="340" height="580" rx="54" fill="#05080d" stroke="#718099" stroke-width="8"/>
    <rect x="28" y="42" width="284" height="496" rx="28" fill="#1a3550"/>
