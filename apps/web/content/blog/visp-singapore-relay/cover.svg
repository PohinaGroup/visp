<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>New VISP relay in Singapore</title>
  <rect width="1200" height="630" fill="#0b0d10"/>
  <g fill="#f2f3f5">
    <rect x="70" y="64" width="8" height="30"/><rect x="84" y="56" width="8" height="38"/><rect x="98" y="70" width="8" height="24"/><rect x="112" y="60" width="8" height="34"/>
  </g>
  <text x="140" y="88" fill="#9299a3" font-family="monospace" font-size="22" letter-spacing="4">VISP RELAY NETWORK</text>
