<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Separate bandwidth budgets from a phone through OBS to a streaming platform</title>
  <desc id="desc">A phone uploads one contribution feed to a relay, home OBS downloads all contribution feeds, and OBS uploads one separately encoded final program.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#111922"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#8ccbd8"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <path d="M120 170H1480" stroke="#283541" stroke-width="2"/>
  <text x="120" y="125" fill="#8b97a4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" letter-spacing="5">THREE BUDGETS · ONE PROGRAM</text>

  <g transform="translate(105 280)">
    <rect width="310" height="330" rx="26" fill="#111820" stroke="#344653" stroke-width="3"/>
    <rect x="105" y="48" width="100" height="182" rx="18" fill="none" stroke="#eef4f6" stroke-width="7"/>
    <circle cx="178" cy="75" r="13" fill="#7bc4d4"/>
    <circle cx="155" cy="258" r="8" fill="#7bc4d4"/>
    <text x="155" y="302" text-anchor="middle" fill="#f0f4f5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700">PHONE</text>
  </g>

  <g transform="translate(650 315)">
    <rect width="300" height="260" rx="26" fill="#111820" stroke="#344653" stroke-width="3"/>
    <path d="M74 96H226M74 130H226M74 164H226" stroke="#7bc4d4" stroke-width="15" stroke-linecap="round"/>
    <text x="150" y="222" text-anchor="middle" fill="#f0f4f5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700">VISP RELAY</text>
  </g>

  <g transform="translate(1185 280)">
    <rect width="310" height="330" rx="26" fill="#111820" stroke="#344653" stroke-width="3"/>
    <rect x="48" y="54" width="214" height="140" rx="12" fill="#0b0f14" stroke="#eef4f6" stroke-width="7"/>
    <rect x="68" y="74" width="104" height="68" rx="5" fill="#1d4753"/>
    <rect x="184" y="74" width="58" height="30" rx="4" fill="#654f2a"/>
    <rect x="184" y="112" width="58" height="30" rx="4" fill="#283541"/>
    <path d="M155 194V232M100 232H210" stroke="#eef4f6" stroke-width="7" stroke-linecap="round"/>
    <text x="155" y="302" text-anchor="middle" fill="#f0f4f5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700">HOME OBS</text>
  </g>

  <path d="M430 410H622" stroke="#7bc4d4" stroke-width="8" marker-end="url(#arrow)" filter="url(#glow)"/>
  <path d="M968 410H1157" stroke="#7bc4d4" stroke-width="8" marker-end="url(#arrow)" filter="url(#glow)"/>

  <rect x="430" y="475" width="193" height="96" rx="16" fill="#17232c" stroke="#3e5867" stroke-width="2"/>
  <text x="526" y="513" text-anchor="middle" fill="#dce9ec" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">PHONE UP</text>
  <text x="526" y="548" text-anchor="middle" fill="#7bc4d4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">2.5 / 4.5 Mb/s</text>

  <rect x="968" y="475" width="190" height="96" rx="16" fill="#17232c" stroke="#3e5867" stroke-width="2"/>
  <text x="1063" y="513" text-anchor="middle" fill="#dce9ec" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">HOME DOWN</text>
  <text x="1063" y="548" text-anchor="middle" fill="#7bc4d4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">Σ REMOTE FEEDS</text>

  <path d="M1340 632V726H1110" stroke="#d7ad62" stroke-width="8" marker-end="url(#arrow)" filter="url(#glow)"/>
  <rect x="715" y="680" width="380" height="100" rx="18" fill="#211c15" stroke="#675231" stroke-width="2"/>
  <text x="905" y="720" text-anchor="middle" fill="#e9dfcd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">HOME UP · FINAL PROGRAM</text>
  <text x="905" y="758" text-anchor="middle" fill="#e2b768" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27" font-weight="700">TWITCH / KICK</text>
</svg>
