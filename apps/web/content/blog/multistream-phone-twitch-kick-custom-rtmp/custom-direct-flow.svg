<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Phone contribution routed to three Direct outputs</title>
  <desc id="desc">A phone sends one stream to a relay. The relay creates separate outputs for a landscape player, a vertical player, and a custom server.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38d8ff"/>
      <stop offset="1" stop-color="#57f0d0"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff8c42"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="235" cy="450" r="180" fill="#0d2942" opacity="0.45"/>
  <circle cx="1360" cy="450" r="290" fill="#10243a" opacity="0.5"/>

  <g transform="translate(130 250)">
    <rect width="230" height="400" rx="42" fill="#17263b" stroke="#68dff7" stroke-width="8"/>
