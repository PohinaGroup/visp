  <path d="M940 450H1220" fill="none" stroke="url(#cyan)" stroke-width="7" stroke-linecap="round"/>
  <path d="M940 500C1050 500 1055 680 1160 680" fill="none" stroke="#ff9f43" stroke-width="16" opacity="0.2" filter="url(#glow)"/>
  <path d="M940 500C1050 500 1055 680 1160 680" fill="none" stroke="url(#amber)" stroke-width="7" stroke-linecap="round"/>

