    <path d="M45 276c40-62 70-22 102-74 20-31 40-27 65-11v145H18v-19c9-11 18-25 27-41Z" fill="#1d8ba5" opacity="0.75"/>
    <circle cx="71" cy="132" r="32" fill="#ffb45f" opacity="0.9"/>
    <rect x="88" y="22" width="54" height="8" rx="4" fill="#61748b"/>
    <circle cx="115" cy="369" r="16" fill="none" stroke="#61748b" stroke-width="5"/>
  </g>

  <path d="M360 450H640" fill="none" stroke="#35d4ff" stroke-width="18" stroke-linecap="round" opacity="0.22" filter="url(#glow)"/>
  <path d="M360 450H640" fill="none" stroke="url(#cyan)" stroke-width="8" stroke-linecap="round"/>
  <g fill="#9cf1ff">
    <circle cx="430" cy="450" r="8"/><circle cx="505" cy="450" r="8"/><circle cx="580" cy="450" r="8"/>
  </g>

  <g transform="translate(640 315)">
    <rect width="300" height="270" rx="56" fill="#17263b" stroke="#55e3dd" stroke-width="8"/>
    <path d="M94 108 150 72l56 36v68l-56 36-56-36Z" fill="#0d3040" stroke="#64e8df" stroke-width="8"/>
    <path d="m126 143 18 18 36-44" fill="none" stroke="#8cf7d8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="252" cy="224" r="12" fill="#62f0d1"/>
  </g>

  <path d="M940 405C1050 405 1055 230 1160 230" fill="none" stroke="#35d4ff" stroke-width="16" opacity="0.2" filter="url(#glow)"/>
  <path d="M940 405C1050 405 1055 230 1160 230" fill="none" stroke="url(#cyan)" stroke-width="7" stroke-linecap="round"/>
