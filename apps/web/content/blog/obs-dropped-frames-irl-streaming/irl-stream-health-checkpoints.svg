<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">IRL stream health checkpoints</title>
  <desc id="desc">A phone sends video through a relay to a home production computer, which sends the finished program to viewers. Each of the three links has its own visual health indicator.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".55" stop-color="#10233a"/>
      <stop offset="1" stop-color="#190f34"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123e5b"/>
      <stop offset="1" stop-color="#15142e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0L8 4 0 8Z" fill="#ffad55"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0L8 4 0 8Z" fill="#55dcff"/>
    </marker>
    <marker id="arrow-violet" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0L8 4 0 8Z" fill="#bc7cff"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="48" fill="url(#background)"/>
  <circle cx="160" cy="165" r="170" fill="#b86a2e" opacity=".10"/>
  <circle cx="1450" cy="730" r="225" fill="#8e4dd0" opacity=".12"/>

  <path d="M335 445H585" fill="none" stroke="#ffad55" stroke-width="12" stroke-linecap="round" stroke-dasharray="3 25" marker-end="url(#arrow-orange)" filter="url(#glow)"/>
  <path d="M790 445H1040" fill="none" stroke="#55dcff" stroke-width="12" stroke-linecap="round" stroke-dasharray="3 25" marker-end="url(#arrow-cyan)" filter="url(#glow)"/>
  <path d="M1280 445H1450" fill="none" stroke="#bc7cff" stroke-width="12" stroke-linecap="round" stroke-dasharray="3 25" marker-end="url(#arrow-violet)" filter="url(#glow)"/>

  <g transform="translate(95 205)">
    <rect width="240" height="480" rx="42" fill="#09131e" stroke="#ffbd73" stroke-width="7"/>
    <rect x="21" y="55" width="198" height="348" rx="22" fill="url(#screen)"/>
    <rect x="84" y="22" width="72" height="10" rx="5" fill="#785b4b"/>
    <circle cx="120" cy="441" r="12" fill="#785b4b"/>
    <circle cx="120" cy="201" r="70" fill="#ffad55" opacity=".22"/>
    <path d="M63 251c22-74 94-74 114 0" fill="none" stroke="#ffcf98" stroke-width="14" stroke-linecap="round"/>
    <circle cx="120" cy="190" r="44" fill="none" stroke="#ffcf98" stroke-width="14"/>
  </g>

  <g transform="translate(585 315)">
    <path d="M103 0 206 60v240l-103 60L0 300V60Z" fill="#112c40" stroke="#55dcff" stroke-width="7"/>
    <path d="m0 60 103 60 103-60M103 120v240" fill="none" stroke="#55dcff" stroke-width="5" opacity=".65"/>
    <circle cx="103" cy="180" r="28" fill="#55dcff" filter="url(#glow)"/>
  </g>

  <g transform="translate(1040 235)">
    <rect width="310" height="390" rx="26" fill="#080e18" stroke="#68e4ff" stroke-width="7"/>
    <rect x="26" y="28" width="258" height="292" rx="14" fill="url(#screen)"/>
    <path d="M54 111c35-57 62 58 96 0s64 61 106-5" fill="none" stroke="#55dcff" stroke-width="9" stroke-linecap="round"/>
    <g fill="#55dcff">
      <rect x="55" y="218" width="18" height="70" rx="5"/>
      <rect x="86" y="190" width="18" height="98" rx="5" opacity=".85"/>
      <rect x="117" y="238" width="18" height="50" rx="5" opacity=".7"/>
    </g>
    <g fill="#bc7cff">
      <circle cx="203" cy="246" r="42" opacity=".25"/>
      <path d="M203 204a42 42 0 0 1 36 63l-36-21Z" opacity=".9"/>
    </g>
    <rect x="119" y="390" width="72" height="55" rx="8" fill="#294055"/>
    <rect x="72" y="438" width="166" height="22" rx="11" fill="#3d5770"/>
  </g>

  <g transform="translate(1450 325)">
    <rect width="100" height="245" rx="26" fill="#171129" stroke="#c28aff" stroke-width="7"/>
    <circle cx="50" cy="73" r="24" fill="#c28aff" opacity=".9"/>
    <path d="M20 170c4-51 23-72 30-72s27 21 30 72" fill="#c28aff" opacity=".72"/>
  </g>

  <g transform="translate(395 575)" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="58" fill="#0d1a28" stroke="#ffad55" stroke-width="5"/>
    <path d="M-26 3h12l9-27L8 28l10-43 12 18" stroke="#ffcf98" stroke-width="7"/>
  </g>
  <g transform="translate(915 575)" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="58" fill="#0d1a28" stroke="#55dcff" stroke-width="5"/>
    <path d="M-28 24V-5M-8 24V-27M12 24V6M32 24V-15" stroke="#87eaff" stroke-width="8"/>
  </g>
  <g transform="translate(1390 575)" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="58" fill="#151126" stroke="#bc7cff" stroke-width="5"/>
    <path d="M-29 6c14-31 24 31 39 0s22 22 34-3" stroke="#d5b2ff" stroke-width="7"/>
  </g>
</svg>
