<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">What the VISP Discord is for</title>
  <desc id="desc">Streamers bring setups, field reports, and questions into the VISP Discord. The server splits into three lanes: community, release notes, and help. Field reports flow back to the VISP team, and release notes flow out to streamers before they go live.</desc>
  <rect width="1600" height="900" fill="#0b1017"/>
  <g font-family="'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace">

    <text x="96" y="96" fill="#8b97a6" font-size="24" letter-spacing="6">VISP — DISCORD</text>
    <rect x="96" y="122" width="1408" height="2" fill="#22303f"/>

    <!-- streamers in -->
    <rect x="96" y="330" width="300" height="200" rx="8" fill="#111a24" stroke="#2c3c4d" stroke-width="2"/>
    <text x="128" y="388" fill="#e8edf2" font-size="30">Streamers</text>
    <text x="128" y="428" fill="#8b97a6" font-size="20">setups</text>
    <text x="128" y="460" fill="#8b97a6" font-size="20">field reports</text>
    <text x="128" y="492" fill="#8b97a6" font-size="20">questions</text>

    <line x1="396" y1="430" x2="596" y2="430" stroke="#3d5468" stroke-width="3"/>
    <polygon points="596,430 580,422 580,438" fill="#3d5468"/>

    <!-- the three lanes -->
    <rect x="596" y="180" width="460" height="150" rx="8" fill="#111a24" stroke="#2c3c4d" stroke-width="2"/>
    <text x="628" y="236" fill="#e8edf2" font-size="30">Community</text>
    <text x="628" y="274" fill="#8b97a6" font-size="20">gear, routes, OBS scenes,</text>
    <text x="628" y="304" fill="#8b97a6" font-size="20">what worked and what didn't</text>

    <rect x="596" y="355" width="460" height="150" rx="8" fill="#111a24" stroke="#2c3c4d" stroke-width="2"/>
    <text x="628" y="411" fill="#e8edf2" font-size="30">Release notes</text>
    <text x="628" y="449" fill="#8b97a6" font-size="20">apps · plugin · relay ·</text>
    <text x="628" y="479" fill="#8b97a6" font-size="20">what to update before a show</text>

    <rect x="596" y="530" width="460" height="150" rx="8" fill="#111a24" stroke="#2c3c4d" stroke-width="2"/>
    <text x="628" y="586" fill="#e8edf2" font-size="30">Help</text>
    <text x="628" y="624" fill="#8b97a6" font-size="20">workflow · publisher · network ·</text>
    <text x="628" y="654" fill="#8b97a6" font-size="20">what the chain strip showed</text>

    <!-- team -->
    <line x1="1056" y1="430" x2="1236" y2="430" stroke="#3d5468" stroke-width="3"/>
    <polygon points="1236,430 1220,422 1220,438" fill="#3d5468"/>
    <text x="1070" y="408" fill="#8b97a6" font-size="18" letter-spacing="3">REPORTS</text>

    <rect x="1236" y="330" width="268" height="200" rx="8" fill="#111a24" stroke="#2c3c4d" stroke-width="2"/>
    <text x="1268" y="388" fill="#e8edf2" font-size="30">VISP team</text>
    <text x="1268" y="428" fill="#8b97a6" font-size="20">fixes</text>
    <text x="1268" y="460" fill="#8b97a6" font-size="20">new builds</text>

    <!-- releases loop back -->
    <path d="M1370 530 V770 H246 V530" fill="none" stroke="#3d5468" stroke-width="3" stroke-dasharray="10 10"/>
    <polygon points="246,530 238,546 254,546" fill="#3d5468"/>
    <text x="620" y="810" fill="#8b97a6" font-size="20">release notes reach you before you go live</text>

    <text x="96" y="864" fill="#5d6b7a" font-size="20">discord.gg/bufTZqbn4z</text>
  </g>
</svg>
