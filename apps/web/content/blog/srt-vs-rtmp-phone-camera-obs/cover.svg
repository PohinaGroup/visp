  <circle cx="78" cy="545" r="9" fill="#c9a35b"/>
  <path d="M78 545 H300" fill="none" stroke="#c9a35b" stroke-width="4" stroke-dasharray="16 11"/>
  <rect x="300" y="485" width="95" height="75" rx="8" fill="none" stroke="#f2f3f5" stroke-width="3"/>
  <path d="M395 522 H470" fill="none" stroke="#f2f3f5" stroke-width="4"/>
  <rect x="470" y="485" width="130" height="75" rx="8" fill="none" stroke="#f2f3f5" stroke-width="3"/>
  <rect x="492" y="505" width="86" height="36" fill="#151a20"/>
  <path d="M600 522 H655" fill="none" stroke="#737b87" stroke-width="3"/>
  <circle cx="665" cy="522" r="9" fill="#d24b4b"/>
  <text x="694" y="530" fill="#9299a3" font-family="monospace" font-size="21">TWITCH / KICK</text>

  <text x="70" y="605" fill="#737b87" font-family="monospace" font-size="20">PHONE -&gt; VISP RELAY -&gt; OBS -&gt; PLATFORM INGEST</text>
