<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="A solid line and a dashed line leave a phone marker, meet a relay block and an OBS block, and end at a red destination dot">
  <rect width="1200" height="630" fill="#0b0d10"/>
  <text x="70" y="88" fill="#9299a3" font-family="monospace" font-size="22" letter-spacing="5">CONTRIBUTION PROTOCOLS / OBS</text>
  <line x1="70" y1="116" x2="1130" y2="116" stroke="#2a2f36" stroke-width="2"/>

  <text x="70" y="204" fill="#f2f3f5" font-family="Arial, sans-serif" font-size="66" font-weight="700">SRT VS RTMP</text>
  <text x="70" y="282" fill="#f2f3f5" font-family="Arial, sans-serif" font-size="66" font-weight="700">FOR A PHONE CAMERA</text>
  <text x="70" y="360" fill="#f2f3f5" font-family="Arial, sans-serif" font-size="66" font-weight="700">IN <tspan fill="#7fb8c4">OBS</tspan></text>
  <text x="70" y="418" fill="#9299a3" font-family="monospace" font-size="22">SRT BY DEFAULT — RTMP WHEN UDP IS BLOCKED</text>

  <circle cx="78" cy="500" r="9" fill="#7fb8c4"/>
