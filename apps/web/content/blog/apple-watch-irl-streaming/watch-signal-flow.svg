<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Apple Watch companion signal flow</title>
  <desc id="desc">Camera media travels from an iPhone through the VISP relay to OBS. Twitch and Kick chat reach the VISP app, which exchanges compact status, preview, and scene-control messages with the paired iPhone and Apple Watch.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101d"/>
      <stop offset="1" stop-color="#10263a"/>
    </linearGradient>
    <linearGradient id="media" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ee7f3"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57d6f0"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b99cff"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#background)"/>
  <circle cx="1430" cy="120" r="230" fill="#3b82f6" opacity=".06"/>
  <circle cx="220" cy="770" r="250" fill="#a78bfa" opacity=".06"/>

  <text x="100" y="98" fill="#b8c8d9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="4">CHAT</text>
  <g transform="translate(105 150)">
    <path d="M24 0h190a24 24 0 0 1 24 24v92a24 24 0 0 1-24 24H78l-46 38 12-38H24A24 24 0 0 1 0 116V24A24 24 0 0 1 24 0Z" fill="#111c2a" stroke="#42546a" stroke-width="4"/>
    <circle cx="65" cy="70" r="18" fill="#9146ff"/>
    <circle cx="119" cy="70" r="18" fill="#53fc18"/>
    <rect x="157" y="55" width="45" height="30" rx="15" fill="#73849a"/>
  </g>

  <g transform="translate(405 116)">
    <rect width="270" height="206" rx="34" fill="#122033" stroke="#6c8199" stroke-width="4"/>
    <path d="M73 91a62 62 0 0 1 120-4 44 44 0 0 1 3 88H74a42 42 0 0 1-1-84Z" fill="#1b3248" stroke="#72d8ed" stroke-width="4"/>
    <circle cx="135" cy="125" r="18" fill="#72d8ed" filter="url(#glow)"/>
    <text x="135" y="250" text-anchor="middle" fill="#d7e5f1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">VISP APP</text>
  </g>

  <path d="M343 220H391" stroke="#b99cff" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowViolet)"/>
  <path d="M682 220H730" stroke="#b99cff" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowViolet)"/>

  <g transform="translate(750 92)">
    <rect width="210" height="390" rx="42" fill="#0d1520" stroke="#92a5ba" stroke-width="6"/>
    <rect x="19" y="34" width="172" height="291" rx="22" fill="#163047"/>
    <path d="M19 241 76 190l33 27 42-70 40 36v142H19Z" fill="#245476"/>
    <circle cx="137" cy="108" r="29" fill="#f1bf72"/>
    <rect x="74" y="346" width="62" height="8" rx="4" fill="#71859a"/>
    <circle cx="105" cy="14" r="5" fill="#71859a"/>
    <text x="105" y="434" text-anchor="middle" fill="#d7e5f1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">iPHONE</text>
  </g>

  <g transform="translate(730 610)">
    <rect x="65" y="-58" width="80" height="82" rx="24" fill="#27374a"/>
    <rect x="65" y="218" width="80" height="82" rx="24" fill="#27374a"/>
    <rect width="210" height="250" rx="58" fill="#0c141e" stroke="#92a5ba" stroke-width="6"/>
    <rect x="25" y="30" width="160" height="190" rx="38" fill="#162638"/>
    <rect x="50" y="61" width="110" height="31" rx="13" fill="#30465e"/>
    <rect x="50" y="108" width="82" height="25" rx="12" fill="#30465e"/>
    <circle cx="58" cy="170" r="10" fill="#9146ff"/>
    <rect x="78" y="162" width="68" height="16" rx="8" fill="#72869b"/>
    <circle cx="166" cy="170" r="10" fill="#53fc18"/>
    <text x="105" y="340" text-anchor="middle" fill="#d7e5f1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">WATCH</text>
  </g>

  <path d="M855 535V494" stroke="#b99cff" stroke-width="7" stroke-linecap="round" marker-start="url(#arrowViolet)" marker-end="url(#arrowViolet)"/>
  <text x="895" y="531" fill="#b99cff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">STATUS · PREVIEW · SCENES</text>

  <text x="100" y="510" fill="#b8c8d9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="4">MEDIA</text>
  <path d="M974 390H1060" stroke="url(#media)" stroke-width="10" stroke-linecap="round" marker-end="url(#arrowBlue)" filter="url(#glow)"/>

  <g transform="translate(1080 280)">
    <path d="M25 55 135 0l110 55v130l-110 55-110-55Z" fill="#12283b" stroke="#57d6f0" stroke-width="5"/>
    <path d="M25 55l110 55 110-55M135 110v130" fill="none" stroke="#57d6f0" stroke-width="4" opacity=".65"/>
    <circle cx="135" cy="110" r="20" fill="#57d6f0" filter="url(#glow)"/>
    <text x="135" y="286" text-anchor="middle" fill="#d7e5f1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">VISP RELAY</text>
  </g>

  <path d="M1338 390H1390" stroke="url(#media)" stroke-width="10" stroke-linecap="round" marker-end="url(#arrowBlue)" filter="url(#glow)"/>
  <g transform="translate(1410 294)">
    <rect width="135" height="172" rx="17" fill="#111c2a" stroke="#8ca2b9" stroke-width="5"/>
    <rect x="13" y="14" width="109" height="116" rx="8" fill="#19344b"/>
    <path d="m67 38 28 18v37l-28 18-28-18V56Z" fill="#57d6f0" opacity=".8"/>
    <rect x="50" y="149" width="35" height="6" rx="3" fill="#8ca2b9"/>
    <text x="67" y="218" text-anchor="middle" fill="#d7e5f1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">OBS</text>
  </g>

  <path d="M540 342C540 470 1145 566 1415 464" fill="none" stroke="#b99cff" stroke-width="6" stroke-dasharray="14 16" marker-end="url(#arrowViolet)" opacity=".9"/>
  <text x="1100" y="612" fill="#b99cff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">OBS CONTROL</text>
</svg>
