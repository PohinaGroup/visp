<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">IRL stream latency checkpoints</title>
  <desc id="desc">A phone, relay, OBS workstation, platform player, and returning chat message form four measurable stages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071423"/>
      <stop offset="1" stop-color="#10263b"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35d7ff"/>
      <stop offset="1" stop-color="#ffad5b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#71e5ff"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="44" fill="url(#bg)"/>
  <path d="M210 450 H1350" stroke="#163e58" stroke-width="34" stroke-linecap="round"/>
  <path d="M210 450 H1350" stroke="url(#signal)" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#glow)"/>

