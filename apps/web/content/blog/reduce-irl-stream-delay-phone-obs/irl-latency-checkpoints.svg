    <path d="M65 78 V113 L88 128" fill="none" stroke="#ffad5b" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g transform="translate(415 328)">
    <path d="M58 182h214c51 0 80-36 80-77 0-43-32-76-75-78C257-14 203-28 164 1c-25 18-38 43-40 72-10-7-22-10-35-10-40 0-71 31-71 70 0 27 14 49 40 49Z" fill="#0d2940" stroke="#71e5ff" stroke-width="7"/>
