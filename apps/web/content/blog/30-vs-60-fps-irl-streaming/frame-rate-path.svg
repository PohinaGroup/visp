<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">30 and 60 FPS contribution paths</title>
  <desc id="desc">One phone branches into a 30 FPS lane with widely spaced frames and a 60 FPS lane with densely spaced frames. Both travel through the same relay and OBS output path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07172b"/>
      <stop offset="1" stop-color="#14152d"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#42d8ff"/>
      <stop offset="1" stop-color="#3866ff"/>
    </linearGradient>
    <linearGradient id="fast" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ff9d58"/>
      <stop offset="1" stop-color="#ff547d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#00091b" flood-opacity=".55"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0l12 6-12 6z" fill="#49d9ff"/>
    </marker>
    <marker id="arrowCoral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0l12 6-12 6z" fill="#ff6d75"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="48" fill="url(#bg)"/>
  <circle cx="250" cy="450" r="190" fill="#0c3150" opacity=".38"/>
  <circle cx="1320" cy="450" r="250" fill="#382039" opacity=".28"/>

  <g filter="url(#shadow)">
    <rect x="120" y="278" width="220" height="344" rx="38" fill="#06101f" stroke="#6be4ff" stroke-width="8"/>
    <rect x="145" y="318" width="170" height="244" rx="16" fill="url(#phone)" opacity=".9"/>
    <circle cx="230" cy="592" r="12" fill="#6be4ff"/>
    <circle cx="178" cy="350" r="18" fill="#07172b" stroke="#b3f2ff" stroke-width="6"/>
    <path d="M169 503c34-77 94-108 138-121v180H145z" fill="#102948" opacity=".66"/>
    <circle cx="258" cy="409" r="26" fill="#ffd5b8"/>
    <path d="M221 479c14-50 39-71 74-70 29 38 27 94 20 124z" fill="#ff6d75"/>
  </g>

  <path d="M340 418H450" stroke="#49d9ff" stroke-width="12" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M340 482H400c36 0 36 138 74 138" fill="none" stroke="#ff6d75" stroke-width="12" stroke-linecap="round" marker-end="url(#arrowCoral)"/>

  <g filter="url(#shadow)">
    <rect x="470" y="190" width="575" height="260" rx="34" fill="#0a263e" stroke="#49d9ff" stroke-width="5"/>
    <text x="520" y="270" fill="#dffaff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="800">30 FPS</text>
    <g fill="#42d8ff">
      <rect x="520" y="315" width="72" height="72" rx="14" opacity=".35"/>
      <rect x="620" y="315" width="72" height="72" rx="14" opacity=".5"/>
      <rect x="720" y="315" width="72" height="72" rx="14" opacity=".65"/>
      <rect x="820" y="315" width="72" height="72" rx="14" opacity=".82"/>
      <rect x="920" y="315" width="72" height="72" rx="14"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="470" y="500" width="575" height="260" rx="34" fill="#331a2a" stroke="#ff6d75" stroke-width="5"/>
    <text x="520" y="580" fill="#fff0ea" font-family="ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="800">60 FPS</text>
    <g fill="url(#fast)">
      <rect x="520" y="625" width="36" height="72" rx="10" opacity=".25"/>
      <rect x="568" y="625" width="36" height="72" rx="10" opacity=".33"/>
      <rect x="616" y="625" width="36" height="72" rx="10" opacity=".41"/>
      <rect x="664" y="625" width="36" height="72" rx="10" opacity=".49"/>
      <rect x="712" y="625" width="36" height="72" rx="10" opacity=".57"/>
      <rect x="760" y="625" width="36" height="72" rx="10" opacity=".65"/>
      <rect x="808" y="625" width="36" height="72" rx="10" opacity=".73"/>
      <rect x="856" y="625" width="36" height="72" rx="10" opacity=".81"/>
      <rect x="904" y="625" width="36" height="72" rx="10" opacity=".9"/>
      <rect x="952" y="625" width="36" height="72" rx="10"/>
    </g>
  </g>

  <path d="M1045 320h92c54 0 54 130 104 130" fill="none" stroke="#49d9ff" stroke-width="12" stroke-linecap="round"/>
  <path d="M1045 630h92c54 0 54-180 104-180" fill="none" stroke="#ff6d75" stroke-width="12" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <path d="M1170 397l85-55 85 55v106l-85 55-85-55z" fill="#101d35" stroke="#9b8cff" stroke-width="7"/>
    <path d="M1214 449h82M1230 423l-30 26 30 26M1280 423l30 26-30 26" fill="none" stroke="#c6bcff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M1340 450h78" stroke="#c6bcff" stroke-width="12" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <g filter="url(#shadow)">
    <rect x="1422" y="343" width="120" height="214" rx="24" fill="#111b30" stroke="#c6bcff" stroke-width="7"/>
    <rect x="1444" y="372" width="76" height="125" rx="10" fill="#1f3153"/>
    <path d="M1464 462v-50l42 25z" fill="#ffcf70"/>
    <circle cx="1482" cy="526" r="10" fill="#c6bcff"/>
  </g>
</svg>
