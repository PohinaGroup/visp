name: Runner benchmark

# Same steps as the Staging check job plus the Release build step, run on
# GitHub-hosted and Blacksmith runners so the two can be compared like for like.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.runner }} (${{ matrix.n }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, blacksmith-4vcpu-ubuntu-2404]
        n: [1, 2, 3]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun test

      - name: Integration tests
        run: bun run test:integration

      - name: Type-check
        run: bun run check-types

      - name: Build API, portal, admin, multi-chat, and Typography
        run: bun x turbo run build -F server -F web -F admin -F multichat -F typography
