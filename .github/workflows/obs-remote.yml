name: OBS Remote

on:
  push:
    branches: [main]
    paths:
      - apps/obs-remote/**
      - packages/api/**
      - packages/auth/**
      - packages/db/**
      - packages/env/**
      - packages/config/**
      - package.json
      - bun.lock
      - turbo.json
      - biome.json
      - .github/workflows/obs-remote.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test, lint, and type-check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/obs-remote test
      - run: bun run --cwd apps/obs-remote check-types
      - run: bun run --cwd apps/obs-remote lint

  export:
    name: Export ${{ matrix.platform }}
    needs: check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        platform: [web, ios, android]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Export
        env:
          EXPO_PUBLIC_SERVER_URL: https://visp-stream.com
        run: bun run --cwd apps/obs-remote build:${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: obs-remote-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: error
          path: apps/obs-remote/dist
