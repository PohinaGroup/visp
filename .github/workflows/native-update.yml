name: Publish native OTA update

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-ota-staging
  cancel-in-progress: false

jobs:
  publish:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: 24.7.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish to XPRem
        working-directory: apps/native
        env:
          EOO_TOKEN: ${{ secrets.EOO_TOKEN }}
          EAS_BUILD_PROFILE: staging
          RELEASE_CHANNEL: staging
        run: |
          set -euo pipefail
          test -n "$EOO_TOKEN"
          test -f certs/certificate.pem
          bunx eoas@3.2.3 publish \
            --branch staging \
            --platform all \
            --message "staging ${GITHUB_SHA}" \
            --nonInteractive \
            --packageRunner bunx
