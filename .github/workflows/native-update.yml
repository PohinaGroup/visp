name: Publish native OTA update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: XPRem channel to publish
        required: true
        type: choice
        default: staging
        options: [staging, production]
      platform:
        description: Platforms to publish
        required: true
        type: choice
        default: all
        options: [all, ios, android]
      message:
        description: Update message
        required: true
        type: string
      confirm:
        description: Type publish to confirm this remote deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-ota-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.confirm == 'publish'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: ${{ inputs.channel == 'production' && 'production' || 'staging' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: 24.7.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish to XPRem
        working-directory: apps/native
        env:
          CHANNEL: ${{ inputs.channel }}
          PLATFORM: ${{ inputs.platform }}
          MESSAGE: ${{ inputs.message }}
          EOO_TOKEN: ${{ secrets.EOO_TOKEN }}
          EAS_BUILD_PROFILE: ${{ inputs.channel }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          test -n "$EOO_TOKEN"
          bunx eoas@3.2.3 publish \
            --branch "$CHANNEL" \
            --platform "$PLATFORM" \
            --message "$MESSAGE" \
            --nonInteractive \
            --disableRepositoryCheck \
            --packageRunner bunx
