name: Mobile

# Builds and submits the mobile apps to Google Play and Apple TestFlight when
# a push to main touches the corresponding app directory. Each job builds only
# the app that changed; both apps build on workflow_dispatch.
#
# Prerequisites (see deploy/UPDATE.md):
# - `production` GitHub environment with an EXPO_TOKEN secret.
# - apps/native: EAS project linked, production EAS environment variables,
#   Play + App Store Connect records, store credentials configured.
# - apps/obs-remote: run `bunx eas init` once in apps/obs-remote (adds
#   extra.eas.projectId to app.json), then configure its EAS production
#   environment and store credentials — its job activates automatically.

on:
  push:
    branches: [main]
    paths:
      - "apps/native/**"
      - "apps/obs-remote/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  detect:
    name: Detect changed apps
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      native: ${{ steps.filter.outputs.native }}
      obs-remote: ${{ steps.filter.outputs.obs-remote }}
      obs-remote-ready: ${{ steps.filter.outputs.obs-remote-ready }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Filter by changed paths
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "native=false" >> "$GITHUB_OUTPUT"
          echo "obs-remote=false" >> "$GITHUB_OUTPUT"
          if [[ -z "$BEFORE" || "$BEFORE" == *0000000000000000000000000000000000000000 ]]; then
            echo "Forcing both apps: before-SHA is empty (dispatch or first push)."
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "obs-remote=true" >> "$GITHUB_OUTPUT"
          else
            files="$(git diff --name-only "$BEFORE" "$SHA")"
            if grep -q '^apps/native/' <<<"$files"; then
              echo "native=true" >> "$GITHUB_OUTPUT"
            fi
            if grep -q '^apps/obs-remote/' <<<"$files"; then
              echo "obs-remote=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          # OBS Remote builds activate once its EAS project is linked.
          if jq -e '.expo.extra.eas.projectId' apps/obs-remote/app.json >/dev/null 2>&1; then
            echo "obs-remote-ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "obs-remote-ready=false" >> "$GITHUB_OUTPUT"
            echo "OBS Remote has no EAS project ID: run 'bunx eas init' in apps/obs-remote to activate its job."
          fi

  native:
    name: Build and submit VISP (Play + TestFlight)
    needs: detect
    if: needs.detect.outputs.native == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: 18.13.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build and submit both platforms
        working-directory: apps/native
        run: eas build --platform all --profile production --auto-submit --non-interactive --wait

  obs-remote:
    name: Build and submit OBS Remote (Play + TestFlight)
    needs: detect
    if: needs.detect.outputs.obs-remote == 'true' && needs.detect.outputs.obs-remote-ready == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: 18.13.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build and submit both platforms
        working-directory: apps/obs-remote
        run: eas build --platform all --profile production --auto-submit --non-interactive --wait
