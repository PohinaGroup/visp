name: Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  check:
    name: Test and type-check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test and type-check
        run: |
          bun test
          bun run check-types

  deploy:
    name: Deploy staging
    needs: check
    # Skips cleanly until the staging environment is configured (DEPLOY_HOST
    # var present); see deploy/STAGING.md.
    if: vars.DEPLOY_HOST != ''
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: staging
    steps:
      - name: Join Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy main to staging
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/deploy_key" "$DEPLOY_USER@$DEPLOY_HOST" \
            sudo /usr/local/sbin/visp-staging-release

      - name: Smoke-check public sites
        env:
          ADMIN_URL: https://admin.staging.visp-stream.com
          APP_URL: https://staging.visp-stream.com
          NATIVE_WEB_URL: https://stream.staging.visp-stream.com
          OBS_REMOTE_WEB_URL: https://remote.staging.visp-stream.com
          DOCS_URL: https://docs.staging.visp-stream.com
          RELAY_URL: https://relay-staging.visp-stream.com
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            "$APP_URL" \
            "$ADMIN_URL" \
            "$NATIVE_WEB_URL" \
            "$OBS_REMOTE_WEB_URL" \
            "$DOCS_URL/docs" \
            "$RELAY_URL/ping"; do
            curl --fail --silent --show-error --retry 12 --retry-all-errors \
              --retry-delay 5 "$url" >/dev/null
          done
