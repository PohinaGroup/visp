[Unit]
StartLimitIntervalSec=0

[Service]
EnvironmentFile=/etc/visp/caddy.env
Restart=always
RestartSec=2
# Reload through the caddy-owned admin socket once the Caddyfile moves the
# admin API there (as deploy/relay/Caddyfile does); until then, and for the
# first reload after the switch, use the default localhost:2019.
ExecReload=
ExecReload=/bin/sh -c 'if [ -S /var/lib/caddy/admin.sock ]; then exec /usr/bin/caddy reload --config /etc/caddy/Caddyfile --force --address unix//var/lib/caddy/admin.sock; else exec /usr/bin/caddy reload --config /etc/caddy/Caddyfile --force --address localhost:2019; fi'
