[Unit]
StartLimitIntervalSec=0

[Service]
EnvironmentFile=/etc/visp/caddy.env
Restart=always
RestartSec=2
# The Caddyfile moves the admin API to a caddy-owned unix socket so other
# local users cannot rewrite the config. Reload through the socket once Caddy
# listens there; the TCP address only serves the first reload after a host
# switches over from the default localhost:2019.
ExecReload=
ExecReload=/bin/sh -c 'if [ -S /var/lib/caddy/admin.sock ]; then exec /usr/bin/caddy reload --config /etc/caddy/Caddyfile --force --address unix//var/lib/caddy/admin.sock; else exec /usr/bin/caddy reload --config /etc/caddy/Caddyfile --force --address localhost:2019; fi'
