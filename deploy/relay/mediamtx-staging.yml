logLevel: info

# Staging MediaMTX. Runs on the app box next to production services, so every
# listener that production's relay box owns is mirrored here on the SAME port
# numbers — publish URLs hardcode 8890/5000/1935/8189 and every relay must
# share them. Loopback-only management endpoints; the public listeners are
# what phones and OBS hit.
authMethod: http
authHTTPAddress: http://127.0.0.1:3100/api/mediamtx/auth
authHTTPExclude:
  - action: api

api: true
apiAddress: 127.0.0.1:9997
metrics: false
pprof: false

rtsp: true
rtspTransports: [tcp]
rtspAddress: 127.0.0.1:8554
hls: false
webrtc: true
webrtcAddress: 127.0.0.1:8889
webrtcAllowOrigins: ["https://staging.visp-stream.com", "https://stream.staging.visp-stream.com"]
webrtcTrustedProxies: ["127.0.0.1/32", "::1/128"]
webrtcLocalUDPAddress: ":8189"
webrtcLocalTCPAddress: ":8189"
webrtcAdditionalHosts: [relay-staging.visp-stream.com]
moq: false

rtmp: true
rtmpAddress: :1935
srt: true
srtAddress: :8890

paths:
  all_others:
    source: publisher
    overridePublisher: false
    runOnAvailable: >-
      /usr/local/libexec/visp-snapshot
      "$APP_ORIGIN" "$MTX_PATH" "$MTX_SOURCE_TYPE"
    runOnAvailableRestart: yes
    runOnUnavailable: >-
      curl --fail --silent --show-error --max-time 2 --request POST
      --header "Content-Type: application/json"
      --header "X-Hook-Secret: $HOOK_SECRET"
      --data "{\"path\":\"$MTX_PATH\"}"
      "$APP_ORIGIN/api/hooks/not-ready"
    runOnRead: >-
      curl --fail --silent --show-error --max-time 2 --request POST
      --header "Content-Type: application/json"
      --header "X-Hook-Secret: $HOOK_SECRET"
      --data "{\"path\":\"$MTX_PATH\",\"readerId\":\"$MTX_READER_ID\"}"
      "$APP_ORIGIN/api/hooks/read"
    runOnUnread: >-
      curl --fail --silent --show-error --max-time 2 --request POST
      --header "Content-Type: application/json"
      --header "X-Hook-Secret: $HOOK_SECRET"
      --data "{\"path\":\"$MTX_PATH\",\"readerId\":\"$MTX_READER_ID\"}"
      "$APP_ORIGIN/api/hooks/unread"
